# GitHub Pages: the README in Vice Glow's own look (_layouts/default.html, assets/site.css).
title: Vice Glow
description: LED lamps from the Windows tray — Bluetooth and Wi-Fi, no phone needed
defaults:
  - scope:
      path: ""
    values:
      layout: default
# the app's sources are not part of the site
exclude:
  - src
  - tools
  - web
  - target
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - CLAUDE.md
