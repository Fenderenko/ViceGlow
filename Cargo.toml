[package]
name = "viceglow"
version = "0.2.2"
edition = "2024"
description = "Vice Glow — LED lamps from the Windows tray"
license = "GPL-3.0-only"
repository = "https://github.com/Fenderenko/ViceGlow"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-future = "0.3.2"
windows-collections = "0.3.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# the icon is drawn by build.rs; optimised it takes a moment instead of many seconds
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
